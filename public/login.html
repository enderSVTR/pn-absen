<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Apel Pagi | Pengadilan Negeri Depok</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body class="auth-page">
    <div class="auth-card fade-in">
      <div class="auth-logo">
        <img
          src="/uploads/logo-pn-depok.jpg"
          alt="Logo PN Depok"
          style="height: 80px; width: auto; border-radius: 8px"
        />
      </div>

      <!-- Alert -->
      <div id="loginAlert" class="alert alert-danger d-none" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i
        ><span id="alertMsg"></span>
      </div>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <div class="input-group">
            <span class="input-group-text"
              ><i class="bi bi-person-fill"></i
            ></span>
            <input
              type="text"
              class="form-control"
              id="username"
              placeholder="Masukkan username"
              required
            />
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text"
              ><i class="bi bi-lock-fill"></i
            ></span>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Masukkan password"
              required
            />
          </div>
        </div>
        <button type="submit" class="btn-gold btn w-100 mb-3" id="btnLogin">
          <i class="bi bi-box-arrow-in-right me-1"></i>Masuk
        </button>

        <div class="text-center">
          <a href="index.html" class="text-decoration-none small">
            <i class="bi bi-arrow-left me-1"></i>Kembali ke Beranda
          </a>
        </div>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const username = document.getElementById("username").value.trim();
          const password = document.getElementById("password").value.trim();
          const alertEl = document.getElementById("loginAlert");
          const alertMsg = document.getElementById("alertMsg");
          const btnLogin = document.getElementById("btnLogin");

          btnLogin.disabled = true;
          btnLogin.innerHTML =
            '<span class="spinner-border spinner-border-sm me-2"></span>Memproses...';

          // Coba login via API server terlebih dahulu
          fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          })
            .then((res) => res.json())
            .then((result) => {
              if (result && result.success) {
                // Simpan session
                localStorage.setItem(
                  "pn_user",
                  JSON.stringify({
                    username: result.data.username,
                    nama: result.data.nama,
                    nip: result.data.nip,
                    jabatan: result.data.jabatan,
                    ruangan: result.data.ruangan,
                    role: result.data.role,
                    loginAt: new Date().toISOString(),
                  }),
                );
                showToast("Login berhasil! Mengalihkan...", "success");
                setTimeout(() => {
                  window.location.href =
                    result.data.role === "admin"
                      ? "dashboard.html"
                      : "absen.html";
                }, 800);
              } else {
                loginLocal();
              }
            })
            .catch(() => loginLocal());

          // Login lokal (mode demo tanpa server)
          function loginLocal() {
            // Admin
            if (username === "admin" && password === "admin123") {
              localStorage.setItem(
                "pn_user",
                JSON.stringify({
                  username: username,
                  nama: "Administrator PN Depok",
                  role: "admin",
                  loginAt: new Date().toISOString(),
                }),
              );
              showToast("Login berhasil! Mengalihkan...", "success");
              setTimeout(() => {
                window.location.href = "dashboard.html";
              }, 800);
              return;
            }

            alertEl.classList.remove("d-none");
            alertMsg.textContent =
              "Database tidak terhubung. Login pegawai tidak tersedia.";
            showToast("Database pegawai tidak dapat diakses", "danger");

            btnLogin.disabled = false;
            btnLogin.innerHTML =
              '<i class="bi bi-box-arrow-in-right me-1"></i>Masuk';
          }
        });
    </script>
  </body>
</html>
